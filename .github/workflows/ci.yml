name: Kiểm tra LAMS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.3', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
        working-directory: backend/insight-service
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash scripts/test-web-e2e-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
  api-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r contracts/openapi/requirements.txt
      - run: python scripts/validate-openapi.py
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.3', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: rustup show active-toolchain
        working-directory: frontend/src-tauri
      - run: npm run build:desktop
        working-directory: frontend
      - run: cargo fmt --check
        working-directory: frontend/src-tauri
      - run: cargo test --locked
        working-directory: frontend/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: frontend/src-tauri
      - run: npm run desktop:build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: lams-windows-x64
          path: frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B clean verify
        working-directory: backend/core-service
  node-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.3', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
        working-directory: backend/insight-service
      - run: npm run prisma:validate && npm run prisma:generate && npm test && npm run build
        working-directory: backend/insight-service
        env:
          INSIGHT_DATABASE_URL: postgresql://lams:ci-placeholder@localhost:15432/lams_insight?schema=public
      - run: npm run test:integration
        working-directory: backend/insight-service
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run lint && npm run build
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker build -t lams-core-ci ./backend/core-service
      - run: docker build -t lams-insight-ci ./backend/insight-service
      - run: docker build -t lams-frontend-ci ./frontend
