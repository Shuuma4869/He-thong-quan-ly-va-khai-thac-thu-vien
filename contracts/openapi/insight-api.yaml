openapi: 3.1.0
info:
  title: LAMS Insight API
  version: 0.1.0
  description: Tra cứu metadata, đề xuất bổ sung sách và hộp thông báo giữ chỗ; không ghi Core hoặc tự đặt mua.
servers:
  - url: http://localhost:3000/api/v1
security: [{ bearerAuth: [] }]
paths:
  /health:
    get:
      operationId: insightHealth
      summary: Trạng thái Insight và kết nối consumer thông báo
      security: []
      description: HTTP 200 là liveness. status DEGRADED khi consumer được bật nhưng chưa tham gia group; không thay kiểm tra readiness hoặc đánh giá độ trễ backlog.
      responses:
        '200':
          description: Trạng thái service
          content:
            application/json:
              schema:
                type: object
                required: [service, status, timestamp, notifications]
                properties:
                  service: { type: string, const: lams-insight-service }
                  status: { type: string, enum: [UP, DEGRADED] }
                  timestamp: { type: string, format: date-time }
                  notifications:
                    type: object
                    required: [enabled, connected]
                    properties:
                      enabled: { type: boolean }
                      connected: { type: boolean }
  /acquisition/analysis:
    get:
      operationId: analyzeAcquisitionDemand
      summary: Xem trước điểm nhu cầu từ snapshot Core
      description: Chỉ nhân viên ACTIVE. Insight chuyển bearer token sang Core; không nhận số đếm từ client.
      parameters:
        - { name: bookId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Snapshot nguồn và điểm dự kiến, content: { application/json: { schema: { type: object, required: [snapshot, score], properties: { snapshot: { $ref: '#/components/schemas/AcquisitionSourceSnapshot' }, score: { type: object, additionalProperties: true } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /acquisition/recommendations:
    get:
      operationId: listAcquisitionRecommendations
      summary: Danh sách đề xuất bổ sung sách đã lưu
      description: >-
        Core xác minh role LIBRARIAN/ADMIN ở mỗi yêu cầu. Chỉ đọc dữ liệu Insight;
        Nguồn tạo đề xuất là snapshot Core, có điểm và bằng chứng lưu trong Insight.
        Giới hạn 60 request/phút/tài khoản/process.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: state, in: query, schema: { type: string, enum: [DRAFT, APPROVED, REJECTED] } }
      responses:
        '200': { description: Trang đề xuất, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAcquisitionRecommendation
      summary: Tạo đề xuất DRAFT từ số liệu Core hiện tại
      description: Chỉ nhận phạm vi; Core tính số đếm. Một Book/chi nhánh/cửa sổ chỉ có một DRAFT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcquisitionScope' }
      responses:
        '201': { description: Đề xuất đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionRecommendation' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /acquisition/recommendations.csv:
    get:
      operationId: exportAcquisitionRecommendations
      summary: Xuất tối đa 1000 đề xuất đã lưu ra CSV UTF-8
      description: Có BOM; lời duyệt được vô hiệu hóa công thức bảng tính. Lọc trạng thái nếu vượt giới hạn dòng.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [DRAFT, APPROVED, REJECTED] } }
      responses:
        '200': { description: Báo cáo CSV, content: { 'text/csv': { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /acquisition/recommendations/{id}:
    get:
      operationId: getAcquisitionRecommendation
      summary: Chi tiết đề xuất và lịch sử quyết định
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Đề xuất, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionRecommendation' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /acquisition/recommendations/{id}/decision:
    post:
      operationId: decideAcquisitionRecommendation
      summary: Duyệt hoặc từ chối một đề xuất nội bộ
      description: >-
        Yêu cầu trạng thái DRAFT và expectedVersion đúng. Ghi trạng thái cùng lịch sử trong
        một transaction; không tạo đơn mua hoặc thay đổi BookCopy.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason, expectedVersion]
              properties:
                action: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: string, minLength: 10, maxLength: 1000 }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '201': { description: Quyết định đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionRecommendation' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /me/notifications:
    get:
      operationId: listReaderNotifications
      summary: Hộp thông báo của principal hiện tại
      description: Core xác minh phiên và role mỗi request; chỉ trả thông báo của principal. Consumer tạo thông báo từ HOLD_CREATED/HOLD_READY/HOLD_EXPIRED/COPY_BORROWED/COPY_RETURNED/LOAN_RENEWED; job Insight tạo tối đa một nhắc hạn trong 24 giờ cho mỗi lượt mượn và dueAt. Giới hạn 120 request/phút/tài khoản/process; no-store.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Trang thông báo, không chứa email hoặc tên sách
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReaderNotificationPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /me/notifications/unread-count:
    get:
      operationId: countUnreadNotifications
      summary: Số thông báo chưa đọc của principal
      responses:
        '200': { description: Số thông báo chưa đọc, content: { application/json: { schema: { type: object, required: [count], properties: { count: { type: integer, minimum: 0 } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /me/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      summary: Đánh dấu thông báo của principal đã đọc
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Đã đọc hoặc đã được đánh dấu trước đó }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: Không có thông báo thuộc principal }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /staff/work-items:
    get:
      operationId: listStaffWorkItems
      summary: Hộp thư công việc giữ chỗ của Librarian/Admin
      description: Core xác minh role mỗi request. Phạm vi hiện hành là toàn hệ thống vì Core chưa có phân công nhân viên theo chi nhánh; branchId chỉ là bộ lọc, không phải ranh giới quyền.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: workType, in: query, schema: { type: string, enum: [WAITING, READY] } }
      responses:
        '200': { description: Công việc mở theo sự kiện Hold đã xử lý; không chứa danh tính Reader, content: { application/json: { schema: { $ref: '#/components/schemas/StaffWorkItemPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /staff/work-items/unread-count:
    get:
      operationId: countOpenStaffWorkItems
      summary: Đếm công việc giữ chỗ đang mở
      description: Chỉ Librarian/Admin. Tổng hợp toàn hệ thống nếu không truyền branchId.
      parameters:
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Số công việc đang mở, content: { application/json: { schema: { type: object, required: [count], properties: { count: { type: integer, minimum: 0 } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /metadata/books/{isbn13}:
    get:
      operationId: lookupBookMetadata
      summary: Tra ISBN-13 bằng Open Library và Google Books fallback
      description: >-
        Core xác minh tài khoản ACTIVE và role LIBRARIAN/ADMIN hiện tại qua auth/me.
        Dùng chung tối đa 10 request/phút/tài khoản/process với tra tác giả, POST history và replay.
        GET/DELETE history có hạn mức riêng 60 request/phút. Không ghi Catalog.
        ISBN-13 phải đúng checksum. Nhà cung cấp lỗi trả status trong attempts;
        Google Books chưa bật/key chưa có trả not-configured, không làm lỗi Core CRUD.
      parameters:
        - { name: isbn13, in: path, required: true, schema: { type: string, pattern: '^\d{13}$' } }
      responses:
        '200':
          description: Kết quả và từng lần thử nguồn; có thể không có ứng viên
          content:
            application/json:
              schema:
                type: object
                required: [attempts, candidates]
                properties:
                  attempts:
                    type: array
                    items:
                      type: object
                      required: [provider, status]
                      properties:
                        provider: { type: string, enum: [open-library, google-books] }
                        status: { $ref: '#/components/schemas/ProviderStatus' }
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/BookMetadata' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /metadata/authors/{openLibraryId}:
    get:
      operationId: lookupAuthorMedia
      summary: Tra ảnh tác giả qua chuỗi định danh Open Library và Wikidata
      description: >-
        Chỉ nhân viên ACTIVE. Yêu cầu định danh hai chiều Open Library/Wikidata,
        ảnh Commons có giấy phép và ghi công; không tìm người theo tên gần giống.
        MIME và kích thước được kiểm trước khi trả ứng viên. verified luôn false;
        nhân viên còn phải duyệt qua Core trước khi ảnh được hiển thị cho bạn đọc.
        Dùng chung hạn mức provider 10 request/phút/tài khoản/process với tra ISBN, POST history và replay.
      parameters:
        - { name: openLibraryId, in: path, required: true, schema: { type: string, pattern: '^OL[1-9]\d*A$' } }
      responses:
        '200':
          description: Ứng viên ảnh chưa được duyệt hoặc danh sách rỗng
          content:
            application/json:
              schema:
                type: object
                required: [status, candidates]
                properties:
                  status: { $ref: '#/components/schemas/ProviderStatus' }
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/MediaCandidate' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /metadata/history:
    get:
      operationId: listMetadataHistory
      summary: Lịch sử của principal hiện tại, lọc theo đầu ISBN
      description: GET danh sách, GET chi tiết và DELETE dùng chung 60 request/phút/tài khoản/process, không trừ hạn mức provider.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: isbn, in: query, schema: { type: string, pattern: '^[0-9]{1,13}$' } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest], default: newest } }
      responses:
        '200': { description: Trang lịch sử, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: lookupAndSaveHistory
      summary: Tra ISBN và lưu dấu vết, không lưu payload provider
      description: Không idempotent; không tự retry khi timeout. Kiểm tra lịch sử trước khi gửi lại. Dùng chung hạn mức provider 10 request/phút/tài khoản/process với tra sách, tác giả và replay; không dùng hạn mức đọc/xóa history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isbn13]
              properties:
                isbn13: { type: string, pattern: '^[0-9]{13}$' }
      responses:
        '201':
          description: Đã lưu dấu vết tra cứu, không đồng nghĩa có ứng viên hoặc ảnh được duyệt
          content:
            application/json:
              schema:
                type: object
                required: [record, lookup]
                properties:
                  record: { $ref: '#/components/schemas/HistoryRecord' }
                  lookup: { $ref: '#/components/schemas/BookLookup' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /metadata/history/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMetadataHistory
      summary: Đọc bản ghi của chính mình
      description: Dùng hạn mức đọc/xóa history 60 request/phút/tài khoản/process, tách khỏi provider.
      responses:
        '200': { description: Dấu vết, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryRecord' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteMetadataHistory
      summary: Xóa lịch sử của mình; không xóa Catalog
      description: Dùng hạn mức đọc/xóa history 60 request/phút/tài khoản/process, tách khỏi provider. Không xóa bản sao lưu; chưa có TTL hoặc tự xóa theo vòng đời tài khoản.
      responses:
        '204': { description: Đã xóa }
        '404': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /metadata/history/{id}/replay:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: replayMetadataHistory
      summary: Tra lại nguồn hiện tại bằng ISBN thuộc lịch sử của mình, không tạo bản ghi mới
      description: Dùng chung hạn mức provider 10 request/phút/tài khoản/process với tra sách, tác giả và POST history.
      responses:
        '200': { description: Metadata hiện tại, content: { application/json: { schema: { $ref: '#/components/schemas/BookLookup' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    RateLimited:
      description: Hết hạn mức của nhóm thao tác hoặc đầy bộ nhớ limiter (tối đa 1000 tài khoản mỗi process). Cửa sổ cố định 60 giây; không phải hạn mức phân tán.
      headers:
        Retry-After:
          description: Số giây nên chờ trước khi thử lại; không tự retry POST tạo lịch sử.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, message]
            properties:
              statusCode: { type: integer, enum: [429] }
              message: { type: string }
    Error:
      description: Lỗi xác thực, phân quyền, tham số hoặc Core không phản hồi
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, message]
            properties:
              statusCode: { type: integer }
              message:
                oneOf:
                  - { type: string }
                  - { type: array, items: { type: string } }
              error: { type: string }
  schemas:
    ReaderNotificationPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReaderNotification' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 50 }
        totalElements: { type: integer, minimum: 0 }
    ReaderNotification:
      type: object
      required: [id, aggregateType, aggregateId, eventType, occurredAt, receivedAt, expiresAt, readAt]
      properties:
        id: { type: string, format: uuid }
        aggregateType: { type: string, enum: [HOLD, LOAN] }
        aggregateId: { type: string, format: uuid }
        eventType: { type: string, enum: [HOLD_CREATED, HOLD_READY, HOLD_EXPIRED, COPY_BORROWED, COPY_RETURNED, LOAN_RENEWED, LOAN_DUE_REMINDER] }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    StaffWorkItemPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffWorkItem' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 50 }
        totalElements: { type: integer, minimum: 0 }
    StaffWorkItem:
      type: object
      required: [aggregateType, aggregateId, workType, branchId, createdAt, updatedAt]
      properties:
        aggregateType: { type: string, const: HOLD }
        aggregateId: { type: string, format: uuid }
        workType: { type: string, enum: [WAITING, READY] }
        branchId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AcquisitionScope:
      type: object
      additionalProperties: false
      required: [bookId, branchId, from, to]
      properties:
        bookId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        from: { type: string, format: date-time, description: Bắt đầu cửa sổ UTC, bao gồm }
        to: { type: string, format: date-time, description: Kết thúc cửa sổ UTC, không bao gồm }
    AcquisitionSourceSnapshot:
      type: object
      required: [contractVersion, sourceRevision, bookId, branchId, window, copiesOwned,
        copiesAvailable, waitingHolds, loansStarted, favoritesAdded]
      properties:
        contractVersion: { type: string, const: acquisition-source-v1 }
        sourceRevision: { type: string }
        bookId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        window:
          type: object
          required: [from, to, asOf]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            asOf: { type: string, format: date-time }
        copiesOwned: { type: integer, minimum: 0 }
        copiesAvailable: { type: integer, minimum: 0 }
        waitingHolds: { $ref: '#/components/schemas/AcquisitionCountSignal' }
        loansStarted: { $ref: '#/components/schemas/AcquisitionCountSignal' }
        favoritesAdded: { $ref: '#/components/schemas/AcquisitionCountSignal' }
    AcquisitionCountSignal:
      type: object
      required: [count, basis, source, unavailableReason]
      properties:
        count: { type: [integer, 'null'], minimum: 0 }
        basis: { type: [string, 'null'], enum: [CURRENT_STATE, WINDOWED_ROWS, EVENT_ADDS, null] }
        source: { type: [string, 'null'] }
        unavailableReason: { type: [string, 'null'] }
    AcquisitionPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AcquisitionRecommendation' } }
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number: { type: integer, minimum: 0 }
            size: { type: integer, minimum: 1, maximum: 50 }
            totalElements: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
    AcquisitionRecommendation:
      type: object
      required: [id, bookId, branchId, windowFrom, windowTo, snapshotAt, sourceContractVersion,
        sourceRevision, scoreVersion, score, confidence, evidence, state, version, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time }
        snapshotAt: { type: string, format: date-time }
        sourceContractVersion: { type: string }
        sourceRevision: { type: string }
        scoreVersion: { type: string }
        score: { type: string, description: Prisma Decimal tuần tự hóa thành chuỗi thập phân. }
        confidence: { type: string, description: Prisma Decimal tuần tự hóa thành chuỗi thập phân. }
        evidence: { type: object, additionalProperties: true }
        state: { type: string, enum: [DRAFT, APPROVED, REJECTED] }
        version: { type: integer, minimum: 0 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        reviewedBy: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewReason: { type: [string, 'null'] }
        decisions: { type: array, items: { $ref: '#/components/schemas/AcquisitionDecision' } }
    AcquisitionDecision:
      type: object
      required: [id, recommendationId, action, actorId, reason, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        recommendationId: { type: string, format: uuid }
        action: { type: string, enum: [APPROVED, REJECTED] }
        actorId: { type: string, format: uuid }
        reason: { type: string }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    HistoryRecord:
      type: object
      required: [id, isbn13, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        isbn13: { type: string, pattern: '^[0-9]{13}$' }
        createdAt: { type: string, format: date-time }
        attempts: { type: array, items: { $ref: '#/components/schemas/LookupAttempt' } }
    LookupAttempt:
      type: object
      required: [provider, status]
      properties:
        provider: { type: string, enum: [open-library, google-books] }
        status: { $ref: '#/components/schemas/ProviderStatus' }
    BookLookup:
      type: object
      required: [attempts, candidates]
      properties:
        attempts: { type: array, items: { $ref: '#/components/schemas/LookupAttempt' } }
        candidates: { type: array, items: { $ref: '#/components/schemas/BookMetadata' } }
    HistoryPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HistoryRecord' } }
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number: { type: integer, minimum: 0 }
            size: { type: integer, minimum: 1, maximum: 100 }
            totalElements: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
    ProviderStatus:
      type: string
      enum: [ok, not-found, unavailable, rate-limited, not-configured, invalid]
    BookMetadata:
      type: object
      required: [source, sourceId, sourceUrl, fetchedAt, title, authors, isbn13, media]
      properties:
        source: { type: string, enum: [open-library, google-books] }
        sourceId: { type: string }
        sourceUrl: { type: string, format: uri }
        fetchedAt: { type: string, format: date-time }
        title: { type: string }
        authors: { type: array, items: { type: string } }
        isbn13: { type: string, pattern: '^\d{13}$' }
        media:
          oneOf:
            - { $ref: '#/components/schemas/MediaCandidate' }
            - { type: 'null' }
    MediaCandidate:
      type: object
      required: [source, source_id, source_url, image_url, thumbnail_url, license, attribution, verified, fetched_at, evidence, mime, bytes]
      properties:
        source: { type: string, enum: [open-library, google-books, wikimedia] }
        source_id: { type: string }
        source_url: { type: string, format: uri }
        image_url: { type: string, format: uri }
        thumbnail_url: { type: string, format: uri }
        license: { type: [string, 'null'] }
        attribution: { type: [string, 'null'] }
        verified: { type: boolean, const: false }
        fetched_at: { type: string, format: date-time }
        evidence:
          type: object
          properties:
            isbn13: { type: string }
            openLibraryAuthorId: { type: string }
            wikidataId: { type: string }
        mime: { type: [string, 'null'] }
        bytes: { type: [integer, 'null'], minimum: 0 }
