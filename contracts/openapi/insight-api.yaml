openapi: 3.1.0
info:
  title: LAMS Insight API
  version: 0.1.0
  description: Tra cứu ứng viên từ nhà cung cấp; không ghi Core và không tự duyệt ảnh.
servers:
  - url: http://localhost:3000/api/v1
security: [{ bearerAuth: [] }]
paths:
  /health:
    get:
      operationId: insightHealth
      summary: Trạng thái Insight và kết nối consumer thông báo
      security: []
      description: HTTP 200 là liveness. status DEGRADED khi consumer được bật nhưng chưa tham gia group; không thay kiểm tra readiness hoặc đánh giá độ trễ backlog.
      responses:
        '200':
          description: Trạng thái service
          content:
            application/json:
              schema:
                type: object
                required: [service, status, timestamp, notifications]
                properties:
                  service: { type: string, const: lams-insight-service }
                  status: { type: string, enum: [UP, DEGRADED] }
                  timestamp: { type: string, format: date-time }
                  notifications:
                    type: object
                    required: [enabled, connected]
                    properties:
                      enabled: { type: boolean }
                      connected: { type: boolean }
  /metadata/books/{isbn13}:
    get:
      operationId: lookupBookMetadata
      summary: Tra ISBN-13 bằng Open Library và Google Books fallback
      description: >-
        Core xác minh tài khoản ACTIVE và role LIBRARIAN/ADMIN hiện tại qua auth/me.
        Dùng chung tối đa 10 request/phút/tài khoản/process với tra tác giả, POST history và replay.
        GET/DELETE history có hạn mức riêng 60 request/phút. Không ghi Catalog.
        ISBN-13 phải đúng checksum. Nhà cung cấp lỗi trả status trong attempts;
        Google Books chưa bật/key chưa có trả not-configured, không làm lỗi Core CRUD.
      parameters:
        - { name: isbn13, in: path, required: true, schema: { type: string, pattern: '^\d{13}$' } }
      responses:
        '200':
          description: Kết quả và từng lần thử nguồn; có thể không có ứng viên
          content:
            application/json:
              schema:
                type: object
                required: [attempts, candidates]
                properties:
                  attempts:
                    type: array
                    items:
                      type: object
                      required: [provider, status]
                      properties:
                        provider: { type: string, enum: [open-library, google-books] }
                        status: { $ref: '#/components/schemas/ProviderStatus' }
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/BookMetadata' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /metadata/authors/{openLibraryId}:
    get:
      operationId: lookupAuthorMedia
      summary: Tra ảnh tác giả qua chuỗi định danh Open Library và Wikidata
      description: >-
        Chỉ nhân viên ACTIVE. Yêu cầu định danh hai chiều Open Library/Wikidata,
        ảnh Commons có giấy phép và ghi công; không tìm người theo tên gần giống.
        MIME và kích thước được kiểm trước khi trả ứng viên. verified luôn false;
        nhân viên còn phải duyệt qua Core trước khi ảnh được hiển thị cho bạn đọc.
        Dùng chung hạn mức provider 10 request/phút/tài khoản/process với tra ISBN, POST history và replay.
      parameters:
        - { name: openLibraryId, in: path, required: true, schema: { type: string, pattern: '^OL[1-9]\d*A$' } }
      responses:
        '200':
          description: Ứng viên ảnh chưa được duyệt hoặc danh sách rỗng
          content:
            application/json:
              schema:
                type: object
                required: [status, candidates]
                properties:
                  status: { $ref: '#/components/schemas/ProviderStatus' }
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/MediaCandidate' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /metadata/history:
    get:
      operationId: listMetadataHistory
      summary: Lịch sử của principal hiện tại, lọc theo đầu ISBN
      description: GET danh sách, GET chi tiết và DELETE dùng chung 60 request/phút/tài khoản/process, không trừ hạn mức provider.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: isbn, in: query, schema: { type: string, pattern: '^[0-9]{1,13}$' } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest], default: newest } }
      responses:
        '200': { description: Trang lịch sử, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: lookupAndSaveHistory
      summary: Tra ISBN và lưu dấu vết, không lưu payload provider
      description: Không idempotent; không tự retry khi timeout. Kiểm tra lịch sử trước khi gửi lại. Dùng chung hạn mức provider 10 request/phút/tài khoản/process với tra sách, tác giả và replay; không dùng hạn mức đọc/xóa history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isbn13]
              properties:
                isbn13: { type: string, pattern: '^[0-9]{13}$' }
      responses:
        '201':
          description: Đã lưu dấu vết tra cứu, không đồng nghĩa có ứng viên hoặc ảnh được duyệt
          content:
            application/json:
              schema:
                type: object
                required: [record, lookup]
                properties:
                  record: { $ref: '#/components/schemas/HistoryRecord' }
                  lookup: { $ref: '#/components/schemas/BookLookup' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /metadata/history/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMetadataHistory
      summary: Đọc bản ghi của chính mình
      description: Dùng hạn mức đọc/xóa history 60 request/phút/tài khoản/process, tách khỏi provider.
      responses:
        '200': { description: Dấu vết, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryRecord' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteMetadataHistory
      summary: Xóa lịch sử của mình; không xóa Catalog
      description: Dùng hạn mức đọc/xóa history 60 request/phút/tài khoản/process, tách khỏi provider. Không xóa bản sao lưu; chưa có TTL hoặc tự xóa theo vòng đời tài khoản.
      responses:
        '204': { description: Đã xóa }
        '404': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /metadata/history/{id}/replay:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: replayMetadataHistory
      summary: Tra lại nguồn hiện tại bằng ISBN thuộc lịch sử của mình, không tạo bản ghi mới
      description: Dùng chung hạn mức provider 10 request/phút/tài khoản/process với tra sách, tác giả và POST history.
      responses:
        '200': { description: Metadata hiện tại, content: { application/json: { schema: { $ref: '#/components/schemas/BookLookup' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    RateLimited:
      description: Hết hạn mức của nhóm thao tác hoặc đầy bộ nhớ limiter (tối đa 1000 tài khoản mỗi process). Cửa sổ cố định 60 giây; không phải hạn mức phân tán.
      headers:
        Retry-After:
          description: Số giây nên chờ trước khi thử lại; không tự retry POST tạo lịch sử.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, message]
            properties:
              statusCode: { type: integer, enum: [429] }
              message: { type: string }
    Error:
      description: Lỗi xác thực, phân quyền, tham số hoặc Core không phản hồi
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, message]
            properties:
              statusCode: { type: integer }
              message:
                oneOf:
                  - { type: string }
                  - { type: array, items: { type: string } }
              error: { type: string }
  schemas:
    HistoryRecord:
      type: object
      required: [id, isbn13, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        isbn13: { type: string, pattern: '^[0-9]{13}$' }
        createdAt: { type: string, format: date-time }
        attempts: { type: array, items: { $ref: '#/components/schemas/LookupAttempt' } }
    LookupAttempt:
      type: object
      required: [provider, status]
      properties:
        provider: { type: string, enum: [open-library, google-books] }
        status: { $ref: '#/components/schemas/ProviderStatus' }
    BookLookup:
      type: object
      required: [attempts, candidates]
      properties:
        attempts: { type: array, items: { $ref: '#/components/schemas/LookupAttempt' } }
        candidates: { type: array, items: { $ref: '#/components/schemas/BookMetadata' } }
    HistoryPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HistoryRecord' } }
        page:
          type: object
          required: [number, size, totalElements, totalPages]
          properties:
            number: { type: integer, minimum: 0 }
            size: { type: integer, minimum: 1, maximum: 100 }
            totalElements: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
    ProviderStatus:
      type: string
      enum: [ok, not-found, unavailable, rate-limited, not-configured, invalid]
    BookMetadata:
      type: object
      required: [source, sourceId, sourceUrl, fetchedAt, title, authors, isbn13, media]
      properties:
        source: { type: string, enum: [open-library, google-books] }
        sourceId: { type: string }
        sourceUrl: { type: string, format: uri }
        fetchedAt: { type: string, format: date-time }
        title: { type: string }
        authors: { type: array, items: { type: string } }
        isbn13: { type: string, pattern: '^\d{13}$' }
        media:
          oneOf:
            - { $ref: '#/components/schemas/MediaCandidate' }
            - { type: 'null' }
    MediaCandidate:
      type: object
      required: [source, source_id, source_url, image_url, thumbnail_url, license, attribution, verified, fetched_at, evidence, mime, bytes]
      properties:
        source: { type: string, enum: [open-library, google-books, wikimedia] }
        source_id: { type: string }
        source_url: { type: string, format: uri }
        image_url: { type: string, format: uri }
        thumbnail_url: { type: string, format: uri }
        license: { type: [string, 'null'] }
        attribution: { type: [string, 'null'] }
        verified: { type: boolean, const: false }
        fetched_at: { type: string, format: date-time }
        evidence:
          type: object
          properties:
            isbn13: { type: string }
            openLibraryAuthorId: { type: string }
            wikidataId: { type: string }
        mime: { type: [string, 'null'] }
        bytes: { type: [integer, 'null'], minimum: 0 }
