openapi: 3.1.0
info:
  title: LAMS Core API
  version: 0.4.0
  description: >-
    Core health, Identity/Auth, Member, Catalog, Inventory, Circulation/Hold và Reader contribution API. Khi bật profile pilot, tất cả
    POST /auth/* yêu cầu Origin HTTPS nằm trong CORS_ALLOWED_ORIGINS và header
    X-LAMS-Client bằng 1; thiếu hoặc sai trả 403. Client trình duyệt tự gửi Origin.
    Local giữ tương thích với cấu hình SameSite=Lax.
    Catalog GET quản trị/Reader cũ, Favorites, Reviews và Rating yêu cầu tài khoản ACTIVE còn role hiện hành
    trong database. GET /public/catalog/* chỉ đọc thông tin thư mục và ảnh Edition được duyệt,
    giới hạn 300 request/phút theo IP kết nối và tối đa 50 mục/trang; không trả thông tin người duyệt.
    Ghi Catalog/media và mọi API Inventory
    chỉ dành cho LIBRARIAN/ADMIN ACTIVE còn quyền trong database; JWT cũ không giữ quyền đã thu hồi.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
paths:
  /public/catalog/books:
    get:
      operationId: listPublicBooks
      tags: [PublicCatalog]
      summary: Tìm tác phẩm công khai; bìa lấy từ ấn bản mới nhất có ảnh được duyệt
      description: >-
        Ảnh Google Books chưa bật. sort=relevance yêu cầu query; tìm theo tên, mô tả,
        tác giả hoặc ISBN, hỗ trợ không dấu và gần đúng theo tên. Thứ tự điểm và ID ổn định
        trong một request, các trang request khác nhau không phải snapshot. categoryTerm lọc theo
        tên Category chuẩn hoặc Alias đã khai báo; không dùng đồng thời với categoryId. Alias nhập nhằng
        trả 409, tên không tồn tại trả trang rỗng. Giới hạn 300 request/phút/IP.
      security: []
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 500 } }
        - { in: query, name: authorId, schema: { type: string, format: uuid } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
        - { in: query, name: categoryTerm, schema: { type: string, maxLength: 150 } }
        - { in: query, name: sort, schema: { type: string, enum: [title, updated, relevance], default: title } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Trang sách công khai
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PublicBook' } }
                  page: { $ref: '#/components/schemas/PageMetadata' }
        '422': { description: Bộ lọc không hợp lệ }
        '409': { description: Tên Category hoặc Alias nhập nhằng }
        '429': { description: 'Vượt giới hạn tra cứu theo IP, xem Retry-After' }
  /public/catalog/books/batch:
    get:
      operationId: getPublicBookCards
      tags: [PublicCatalog]
      summary: Lấy thông tin thẻ sách cho thư viện cá nhân
      description: >-
        Nhận từ 1 đến 20 bookId khác nhau. Trả về những tác phẩm còn tồn tại theo đúng thứ tự yêu cầu;
        ID không còn tồn tại được bỏ qua. Mỗi thẻ chỉ có bìa đã duyệt, điểm đánh giá tổng hợp
        và thông tin nguồn thư mục công khai. Cùng giới hạn 300 request/phút/IP với Catalog.
      security: []
      parameters:
        - in: query
          name: bookId
          required: true
          description: Lặp tham số để lấy nhiều tác phẩm.
          schema: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
          style: form
          explode: true
      responses:
        '200':
          description: Danh sách thẻ sách theo thứ tự yêu cầu
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PublicBook' } }
        '422': { description: Số lượng hoặc mã sách không hợp lệ }
        '429': { description: Vượt giới hạn tra cứu }
  /public/catalog/books/{id}:
    get:
      operationId: getPublicBook
      tags: [PublicCatalog]
      summary: Chi tiết tác phẩm công khai
      security: []
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Tác phẩm và bìa đã duyệt nếu có
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBook' }
        '404': { description: Không có tác phẩm }
        '429': { description: Vượt giới hạn tra cứu }
  /public/catalog/books/{id}/editions:
    get:
      operationId: listPublicEditions
      tags: [PublicCatalog]
      summary: Các ấn bản thuộc tác phẩm, tối đa 50 mục/trang
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Trang ấn bản
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Edition' } }
                  page: { $ref: '#/components/schemas/PageMetadata' }
        '404': { description: Không có tác phẩm }
        '429': { description: Vượt giới hạn tra cứu }
  /public/catalog/{kind}:
    get:
      operationId: listPublicNames
      tags: [PublicCatalog]
      summary: Liệt kê tác giả hoặc thể loại
      security: []
      parameters:
        - { in: path, name: kind, required: true, schema: { type: string, enum: [authors, categories] } }
        - { in: query, name: query, schema: { type: string, maxLength: 150 }, description: Tìm tên không phân biệt dấu hoặc hoa thường }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Trang tên và UUID tác giả/thể loại }
        '422': { description: Từ khóa quá dài hoặc phân trang không hợp lệ }
        '429': { description: Vượt giới hạn tra cứu }
  /public/catalog/{kind}/media:
    get:
      operationId: getPublicDirectoryImages
      tags: [PublicCatalog]
      summary: Ảnh tác giả và bìa sách đại diện thể loại đã được duyệt
      description: >-
        authors trả chân dung đã duyệt. categories chỉ trả bìa của tác phẩm thực sự thuộc thể loại;
        đây là bìa minh họa, không phải ảnh thể loại. Không có ảnh phù hợp thì trả mảng rỗng.
        Nguồn Google Books chưa bật. Không trả thông tin người duyệt.
      security: []
      parameters:
        - { in: path, name: kind, required: true, schema: { type: string, enum: [authors, categories] } }
        - in: query
          name: itemId
          required: true
          schema: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
          style: form
          explode: true
      responses:
        '200': { description: Ảnh theo thứ tự ID yêu cầu, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PublicDirectoryImage' } } } } }
        '422': { description: Danh sách ID không hợp lệ }
        '429': { description: Vượt giới hạn tra cứu }
  /public/catalog/{kind}/{id}:
    get:
      operationId: getPublicName
      tags: [PublicCatalog]
      summary: Tên tác giả hoặc thể loại theo UUID
      security: []
      parameters:
        - { in: path, name: kind, required: true, schema: { type: string, enum: [authors, categories] } }
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Tên và UUID }
        '404': { description: Không có mục }
  /public/catalog/editions/{id}/media:
    get:
      operationId: getPublicEditionCover
      tags: [PublicCatalog]
      summary: Ảnh ấn bản đã duyệt, không trả thông tin nhân viên
      security: []
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: '{media:null} nếu chưa có ảnh được duyệt hoặc nguồn Google Books đang tắt' }
        '429': { description: Vượt giới hạn tra cứu }
  /inventory-sessions:
    post:
      operationId: startInventorySession
      tags: [Inventory]
      summary: Mở phiên và chụp snapshot tối đa 5000 Copy trong một chi nhánh hoặc kệ
      description: Chỉ staff ACTIVE hiện hành. Mỗi chi nhánh tối đa một phiên OPEN để tránh scope chồng lấn. Cùng actor/requestId và nội dung trả receipt cũ; khác nội dung trả 409. Không sửa Copy.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, branchId]
              properties:
                requestId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
                shelfId: { type: [string, 'null'], format: uuid }
      responses:
        '201':
          description: Phiên và metadata snapshot, kể cả replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventorySession' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '404': { description: Không có chi nhánh hoặc kệ }
        '409': { description: 'Chi nhánh tắt, phiên OPEN còn tồn tại hoặc key xung đột' }
        '422': { description: Scope sai hoặc vượt giới hạn }
    get:
      operationId: listInventorySessions
      tags: [Inventory]
      summary: Staff xem phiên theo chi nhánh/trạng thái, thứ tự openedAt/id giảm dần
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: branchId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [OPEN, FINALIZED, CANCELLED] } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang phiên kiểm kê
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InventorySession' } }
                  page: { $ref: '#/components/schemas/InventoryPagination' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '422': { description: Bộ lọc hoặc phân trang không hợp lệ }
  /inventory-sessions/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getInventorySession
      tags: [Inventory]
      summary: Staff đọc scope, version và trạng thái phiên
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Phiên
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventorySession' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '404': { description: Không có phiên }
  /inventory-sessions/{id}/snapshot:
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getInventorySnapshot
      tags: [Inventory]
      summary: Staff đọc snapshot cố định, thứ tự Copy UUID tăng dần
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang bằng chứng Copy
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InventoryCopyEvidence' } }
                  page: { $ref: '#/components/schemas/InventoryPagination' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '404': { description: Không có phiên }
        '422': { description: Phân trang không hợp lệ }
  /inventory-sessions/{id}/scans:
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: appendInventoryScan
      tags: [Inventory]
      summary: Lưu scan append-only, tối đa 20000 scan mỗi phiên
      description: >-
        Chỉ staff ACTIVE hiện hành. Kệ quét phải thuộc scope phiên; mã không tồn tại vẫn được lưu làm bằng chứng.
        clientScanId là khóa retry của actor; giữ nguyên khi mạng lỗi. Retry đúng payload trả kết quả cũ kể cả sau finalize,
        key đổi nội dung hoặc scan mới sau chốt trả 409. clientScannedAt tùy chọn, từ openedAt trừ 5 phút đến server now cộng 5 phút;
        thứ tự xử lý dùng receivedAt/id của server, không tin đồng hồ thiết bị. Không sửa Copy.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientScanId, barcode, shelfId]
              properties:
                clientScanId: { type: string, format: uuid }
                barcode: { type: string, minLength: 1, maxLength: 100 }
                shelfId: { type: string, format: uuid }
                clientScannedAt: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Scan đã lưu hoặc receipt cũ
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/InventoryScan' }
                  - type: object
                    required: [sessionId, sessionVersion]
                    properties:
                      sessionId: { type: string, format: uuid }
                      sessionVersion: { type: integer, minimum: 0 }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '404': { description: Không có phiên hoặc kệ }
        '409': { description: Phiên đã chốt/hủy hoặc key xung đột }
        '422': { description: 'Dữ liệu sai, ngoài scope hoặc quá giới hạn' }
    get:
      operationId: listInventoryScans
      tags: [Inventory]
      summary: Staff đọc scan theo receivedAt/id tăng dần
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang scan
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InventoryScan' } }
                  page: { $ref: '#/components/schemas/InventoryPagination' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '404': { description: Không có phiên }
        '422': { description: Phân trang không hợp lệ }
  /inventory-sessions/{id}/finalize:
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: finalizeInventorySession
      tags: [Inventory]
      summary: Staff đóng tập scan và lưu bằng chứng bất thường
      description: Kiểm version phiên; scan cạnh tranh làm version cũ trả 409. Cùng requestId trả receipt cũ; key mới không chốt lại. Không tự sửa trạng thái hoặc vị trí Copy.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryCloseRequest' }
      responses:
        '200':
          description: Phiên FINALIZED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventorySession' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '404': { description: Không có phiên }
        '409': { description: 'Version cũ, đã chốt/hủy hoặc key xung đột' }
        '422': { description: Dữ liệu không hợp lệ }
  /inventory-sessions/{id}/cancel:
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: cancelInventorySession
      tags: [Inventory]
      summary: Staff hủy phiên đang mở, bắt buộc ghi lý do
      description: Kiểm version và requestId như finalize; giữ nguyên snapshot/scan, không sinh anomaly từ phiên đã hủy.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryCloseRequest' }
      responses:
        '200':
          description: Phiên CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventorySession' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '404': { description: Không có phiên }
        '409': { description: 'Version cũ, đã chốt/hủy hoặc key xung đột' }
        '422': { description: Thiếu lý do hoặc dữ liệu không hợp lệ }
  /inventory-sessions/{id}/anomalies:
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: listInventoryAnomalies
      tags: [Inventory]
      summary: Staff đọc bằng chứng đã chốt, không tính lại từ Copy sống
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang bất thường; rỗng trước finalize hoặc khi đã hủy
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InventoryAnomaly' } }
                  page: { $ref: '#/components/schemas/InventoryPagination' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '404': { description: Không có phiên }
        '422': { description: Phân trang không hợp lệ }
  /inventory-sessions/{id}/anomalies/{anomalyId}/resolution:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: anomalyId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveInventoryAnomaly
      tags: [Inventory]
      summary: Nhân viên ghi nhận rà soát hoặc xác nhận chuyển bản sách về kệ đã quét
      description: >-
        Chỉ áp dụng cho bất thường thuộc phiên FINALIZED. Mỗi bất thường có một quyết định; cùng actor/requestId/payload
        trả lại biên nhận cũ. REVIEWED giữ nguyên Copy và lưu lý do. MOVE_TO_SCANNED_SHELF chỉ dành cho sai kệ/chi nhánh,
        dùng kệ từ scan đã lưu; từ chối nếu Copy khác version lúc chốt, mã vạch/kệ/chi nhánh thay đổi hoặc Copy đang mượn/giữ chỗ.
        Không tự đổi trạng thái Copy và không kết luận bản chưa quét đã mất.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryResolutionRequest' }
      responses:
        '201':
          description: Biên nhận quyết định rà soát
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryResolution' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không còn quyền nhân viên }
        '404': { description: Không có phiên hoặc bất thường }
        '409': { description: 'Copy/phiên đã thay đổi, bất thường đã xử lý hoặc key xung đột' }
        '422': { description: 'Hành động, lý do hoặc version không hợp lệ' }
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Tạo tài khoản READER và đăng nhập ngay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Đăng nhập bằng email hoặc mã thành viên
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Rotate refresh cookie và cấp access token mới
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Thu hồi refresh family và xóa cookie
      responses:
        '204': { description: Đã đăng xuất; access token cũ hết hạn theo TTL }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Lấy thông tin Identity của người đang đăng nhập
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Identity hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /me/profile:
    get:
      operationId: getCurrentMemberProfile
      tags: [Member]
      summary: Lấy hồ sơ và thông tin Identity của chính người đang đăng nhập
      description: Scope luôn lấy từ principal JWT; endpoint chỉ đọc và trả profile null khi chưa có dữ liệu Member-specific.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Hồ sơ hiện tại (read-only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentMemberProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /me/account:
    get:
      operationId: getMyAccount
      tags: [Member]
      summary: Đọc thông tin tài khoản của chính người đăng nhập
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tài khoản hiện tại, content: { application/json: { schema: { $ref: '#/components/schemas/AccountCenter' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMyAccount
      tags: [Member]
      summary: Cập nhật họ tên và số điện thoại E.164 của chính người đăng nhập
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName]
              properties:
                fullName: { type: string, minLength: 1, maxLength: 150 }
                phone: { type: [string, 'null'], pattern: '^\+[1-9][0-9]{7,14}$' }
      responses:
        '200': { description: Tài khoản sau khi lưu, content: { application/json: { schema: { $ref: '#/components/schemas/AccountCenter' } } } }
        '409': { description: Số điện thoại đã được sử dụng }
        '422': { description: Dữ liệu không hợp lệ }
  /me/account/password:
    post:
      operationId: changeMyPassword
      tags: [Member]
      summary: Đổi mật khẩu khi biết mật khẩu hiện tại, thu hồi mọi refresh token của tài khoản
      description: Tăng phiên bản thông tin đăng nhập để JWT cũ hết hiệu lực ngay; client đăng xuất sau khi đổi.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Đã đổi mật khẩu và thu hồi refresh token }
        '403': { description: Mật khẩu hiện tại sai hoặc tài khoản ngừng hoạt động }
        '422': { description: Mật khẩu mới không đạt yêu cầu }
  /me/account/email-request:
    post:
      operationId: requestMyEmailChange
      tags: [Member]
      summary: Ghi nhận email mới ở trạng thái chờ xác minh
      description: Pilot chưa có dịch vụ gửi thư; endpoint không đổi email đăng nhập và chưa thể hoàn tất xác minh.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, email]
              properties:
                currentPassword: { type: string }
                email: { type: string, format: email, maxLength: 320 }
      responses:
        '200': { description: Email chờ xác minh, content: { application/json: { schema: { $ref: '#/components/schemas/AccountCenter' } } } }
        '403': { description: Mật khẩu hiện tại sai hoặc tài khoản ngừng hoạt động }
        '409': { description: Email đã được sử dụng }
    delete:
      operationId: cancelMyEmailChange
      tags: [Member]
      summary: Hủy yêu cầu đổi email chưa xác minh
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Đã hủy yêu cầu }
  /me/favorites:
    get:
      operationId: listMyFavorites
      tags: [Favorites]
      summary: Lấy danh sách sách yêu thích của tài khoản hiện tại
      description: Scope lấy từ principal; userId không được nhận từ request. Chỉ user ACTIVE có role hiện hành được truy cập. Sort ổn định theo favoritedAt rồi bookId.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: favoritedAt,desc
            enum: ['favoritedAt,asc', 'favoritedAt,desc']
      responses:
        '200': { description: Trang Favorites của principal hiện tại, content: { application/json: { schema: { $ref: '#/components/schemas/FavoritePage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/favorites/states:
    get:
      operationId: getMyFavoriteStates
      tags: [Favorites]
      summary: Kiểm trạng thái yêu thích cho tối đa 50 sách trong một lần đọc
      description: Chỉ trả trạng thái của tài khoản hiện tại; không đưa dữ liệu này vào projection công khai.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookId
          in: query
          required: true
          schema: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
          style: form
          explode: true
      responses:
        '200':
          description: Trạng thái theo thứ tự bookId trong request
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [bookId, saved]
                      properties:
                        bookId: { type: string, format: uuid }
                        saved: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/favorites/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMyFavoriteState
      tags: [Favorites]
      summary: Kiểm trạng thái lưu của principal cho một sách
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Book tồn tại, saved phản ánh Favorites của riêng principal
          content:
            application/json:
              schema:
                type: object
                required: [bookId, saved]
                properties:
                  bookId: { type: string, format: uuid }
                  saved: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: addMyFavorite
      tags: [Favorites]
      summary: Thêm sách vào Favorites của principal hiện tại
      description: Không có request body. PUT lặp không tạo duplicate; lần tạo trả 201, lần đã tồn tại trả 200.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Favorite đã tồn tại
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorite' }
        '201':
          description: Favorite vừa được tạo
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorite' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Favorite đang được thêm/xóa cạnh tranh; tải lại trước khi thử lại, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } } }
    delete:
      operationId: removeMyFavorite
      tags: [Favorites]
      summary: Bỏ sách khỏi Favorites của principal hiện tại
      description: Idempotent; Favorite không tồn tại trả 204 nếu Book vẫn tồn tại.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Đã bỏ Favorite hoặc Favorite chưa tồn tại }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /books/{bookId}/reviews:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listBookReviews
      tags: [Reviews and ratings]
      summary: Liệt kê Reviews công khai của một sách
      description: Reviews được công khai ngay sau khi tạo. Response không chứa userId hoặc thông tin định danh người viết; mine chỉ cho biết review có thuộc principal hiện tại không. Sort ổn định theo createdAt rồi reviewId.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: createdAt,desc
            enum: ['createdAt,asc', 'createdAt,desc']
      responses:
        '200': { description: Trang reviews, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createBookReview
      tags: [Reviews and ratings]
      summary: Tạo review và rating của principal hiện tại cho sách
      description: Mỗi user chỉ có một review trên mỗi Book. Review được công khai ngay; không có API moderation trong phạm vi này.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '201':
          description: Review đã tạo
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Principal đã có review cho sách này, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /books/{bookId}/reviews/summary:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBookRatingSummary
      tags: [Reviews and ratings]
      summary: Lấy rating aggregate được tính từ Reviews hiện hành
      description: Average được làm tròn 2 chữ số bằng HALF_UP; khi chưa có review, average là null và count bằng 0. Aggregate không lưu thành nguồn dữ liệu độc lập.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Average và số reviews, content: { application/json: { schema: { $ref: '#/components/schemas/RatingSummary' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /books/{bookId}/reviews/{reviewId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateBookReview
      tags: [Reviews and ratings]
      summary: Cập nhật body hoặc rating của review thuộc principal
      description: >-
        Field bị bỏ qua giữ nguyên; null tường minh và body trắng trả 422.
        UPDATE chỉ sửa field được gửi lên. Hai PATCH khác field không ghi đè nhau;
        cùng field dùng lần ghi được database thực hiện sau, không có optimistic version.
        Review bị xóa trước UPDATE trả 404, không phục hồi bản ghi.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewUpdateRequest' }
      responses:
        '200': { description: Review đã cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteBookReview
      tags: [Reviews and ratings]
      summary: Xóa review của chính principal
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Review đã xóa }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /me/reviews:
    get:
      operationId: listMyReviews
      tags: [Reviews and ratings]
      summary: Đánh giá của principal hiện tại
      description: ACTIVE và role hiện hành; không nhận owner từ client. Sort createdAt DESC rồi reviewId ASC. bookId là bộ lọc, sách chưa có review của mình trả trang rỗng. Không trả PII.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: bookId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Trang review của mình, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /members:
    get:
      operationId: listMembers
      tags: [Member]
      summary: Staff tìm kiếm và phân trang danh sách thành viên
      description: Chỉ LIBRARIAN/ADMIN có token phù hợp và tài khoản ACTIVE còn quyền staff trong database. Token cũ không giữ quyền sau khi bị khóa hoặc thu hồi role. Query chỉ tìm memberCode/fullName, không tìm email.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 150 } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: memberCode,asc
            enum: ['memberCode,asc', 'memberCode,desc', 'fullName,asc', 'fullName,desc']
      responses:
        '200':
          description: Trang thành viên; chỉ chứa dữ liệu được phép cho staff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /authors:
