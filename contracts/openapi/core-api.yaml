        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /loans/{loanId}:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLoan
      tags: [Circulation]
      summary: Đọc hiện trạng một lượt mượn
      description: Chủ lượt mượn hoặc LIBRARIAN/ADMIN còn quyền hiện hành; người khác nhận 403, UUID không tồn tại nhận 404. Không trả thông tin liên hệ hay policy nội bộ.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lượt mượn, content: { application/json: { schema: { $ref: '#/components/schemas/LoanHistoryItem' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reports/circulation:
    get:
      operationId: getCirculationReport
      tags: [Circulation]
      summary: Thống kê các lượt bắt đầu mượn trong khoảng thời gian
      description: >-
        LIBRARIAN/ADMIN ACTIVE. from/to bắt buộc, ISO 8601 có múi giờ, [from,to), tối đa 366 ngày.
        Nhóm ngày mượn và chi nhánh lịch sử; timezone mặc định Asia/Ho_Chi_Minh, có thể chọn UTC.
        borrowed là số Loan bắt đầu trong kỳ; active/returned/overdue là hiện trạng của chính nhóm Loan này tại asOf.
        overdue nằm trong active, không cộng lần nữa. Đây không phải số lượt trả phát sinh trong kỳ hay báo cáo hồi tố tại to.
        Ngày không có lượt mượn không tạo dòng. Tối đa 10000 dòng, vượt trả 422 thay vì cắt dữ liệu.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: timezone, in: query, schema: { type: string, enum: [UTC, Asia/Ho_Chi_Minh], default: Asia/Ho_Chi_Minh } }
      responses:
        '200': { description: Thống kê theo ngày và chi nhánh, content: { application/json: { schema: { $ref: '#/components/schemas/CirculationReport' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /reports/circulation.csv:
    get:
      operationId: exportCirculationReport
      tags: [Circulation]
      summary: Xuất CSV thống kê mượn theo ngày và chi nhánh
      description: >-
        Cùng quyền, bộ lọc, cách tính và giới hạn như GET /reports/circulation. Một file là một snapshot;
        hai request JSON/CSV khác thời điểm có thể khác dữ liệu. UTF-8 BOM, CRLF, quote/escape trường text;
        tên bắt đầu bằng công thức hoặc ký tự điều khiển được thêm dấu nháy đơn. Không xuất danh tính người mượn.
        File rỗng có header; mỗi dòng có from/to/timezone/as_of. File này không chứa chi tiết từng Loan.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: timezone, in: query, schema: { type: string, enum: [UTC, Asia/Ho_Chi_Minh], default: Asia/Ho_Chi_Minh } }
      responses:
        '200':
          description: CSV đính kèm, Cache-Control no-store
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /loans/{loanId}/return:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: returnLoan
      tags: [Circulation]
      summary: Nhân viên nhận trả sách tại chi nhánh của lượt mượn
      description: >-
        LIBRARIAN/ADMIN ACTIVE. Khóa Book/Copy rồi Loan. Đóng Loan, đổi Copy AVAILABLE, audit/outbox cùng transaction.
        Người mượn bị khóa vẫn được trả sách. Yêu cầu mới cho Loan đã trả hoặc version cũ trả 409.
        Retry cùng actor/requestId/nội dung trả response gốc 200. Phân bổ Hold đồng bộ trong cùng transaction;
        Copy có thể kết thúc ở ON_HOLD, copyVersion trong response là version sau phân bổ.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnRequest' }
      responses:
        '200': { description: Đã nhận trả hoặc kết quả gốc của yêu cầu gửi lại, content: { application/json: { schema: { $ref: '#/components/schemas/LoanCommandResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /loans/{loanId}/renew:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: renewLoan
      tags: [Circulation]
      summary: Gia hạn lượt mượn của mình hoặc thực hiện tại quầy
      description: >-
        Chủ lượt mượn hoặc LIBRARIAN/ADMIN còn quyền hiện hành. Người mượn phải ACTIVE và còn quyền đọc.
        Loan đang mở, version đúng, Copy ON_LOAN tại chi nhánh ACTIVE; chưa đến hạn trả, chưa hết số lần gia hạn,
        không có WAITING phù hợp Edition hoặc bất kỳ Edition tại chi nhánh này. Khi blockOverdue=true còn kiểm các Loan khác.
        Hạn mới bằng hạn cũ cộng renewalDuration của policy hiện hành; lưu audit riêng, không sửa snapshot lúc mượn.
        Retry cùng actor/requestId/nội dung trả snapshot gốc; key khác nội dung hoặc xung đột trả 409.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedRequest' }
      responses:
        '200': { description: Đã gia hạn hoặc kết quả gốc, content: { application/json: { schema: { $ref: '#/components/schemas/LoanCommandResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /holds:
    post:
      operationId: createHold
      tags: [Hold]
      summary: Giữ chỗ một đầu sách tại chi nhánh nhận
      description: >-
        Tài khoản ACTIVE còn READER/LIBRARIAN/ADMIN; readerId lấy từ principal. Một WAITING/READY cho cùng người/Book,
        kể cả khác chi nhánh. editionId phải thuộc Book và anyEdition=false; hoặc editionId=null và anyEdition=true.
        Chi nhánh phải ACTIVE. Hạn mức phát triển 10 yêu cầu đang mở/người, có thể cấu hình.
        Có Copy phù hợp thì phân bổ FIFO theo queuedAt/id trong cùng transaction, response có thể READY.
        Quota mượn đầy vẫn được xếp WAITING; chỉ phân bổ khi đủ điều kiện mượn. Retry cùng key/nội dung trả snapshot gốc 201.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldRequest' }
      responses:
        '201': { description: Đã tạo hoặc kết quả gốc, content: { application/json: { schema: { $ref: '#/components/schemas/Hold' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /holds/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getHold
      tags: [Hold]
      summary: Đọc giữ chỗ của mình hoặc tra cứu tại quầy
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Giữ chỗ hiện tại, content: { application/json: { schema: { $ref: '#/components/schemas/HoldView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /holds/{id}/estimate:
    get:
      operationId: estimateHold
      tags: [Hold]
      summary: Ước tính có điều kiện cho giữ chỗ của mình hoặc staff
      description: >-
        Đọc cùng snapshot, không ghi ETA hoặc phân bổ Copy. Mô phỏng hàng chờ tới yêu cầu hiện tại theo ấn bản và chi nhánh,
        giả định người trước vẫn nhận vào cuối hạn, trả đúng hạn, không gia hạn và policy không đổi.
        Đây không phải cam kết, khoảng tin cậy hoặc cận trên. Nếu nguồn lực liên quan đã tới/quá hạn,
        dữ liệu không nhất quán hoặc phạm vi vượt 500 yêu cầu/500 bản lưu thông, estimatedAt là null và có reason.
        Không xuất danh tính người đứng trước, mã Copy hoặc Loan của họ. asOf là lúc đọc, policyVersion là chính sách mô phỏng.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Ước tính hoặc lý do chưa có ngày dự kiến, content: { application/json: { schema: { $ref: '#/components/schemas/HoldEstimate' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /holds/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelHold
      tags: [Hold]
      summary: Chủ yêu cầu hủy giữ chỗ đang mở
      description: >-
        Chỉ chủ yêu cầu ACTIVE còn quyền đọc; staff không được hủy thay qua endpoint này.
        version phải khớp Hold WAITING/READY. Hủy READY giải phóng Copy và phân bổ cho người kế tiếp cùng transaction.
        Muốn đổi chi nhánh/ấn bản phải hủy rồi tạo mới, không giữ vị trí cũ. Retry cùng key/nội dung trả snapshot gốc.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedRequest' }
      responses:
        '200': { description: Đã hủy hoặc kết quả gốc, content: { application/json: { schema: { $ref: '#/components/schemas/Hold' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/holds:
    get:
      operationId: listMyHolds
      tags: [Hold]
      summary: Lịch sử giữ chỗ của tài khoản hiện tại
      description: Không nhận readerId; queuedAt giảm dần rồi id tăng dần. Count/items cùng snapshot database.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Danh sách riêng tư, content: { application/json: { schema: { $ref: '#/components/schemas/HoldPage' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /holds/pickup-branches:
    get:
      operationId: listPickupBranches
      tags: [Hold]
      summary: Danh sách chi nhánh đang nhận giữ chỗ
      description: Tài khoản ACTIVE còn quyền đọc. Chỉ projection id/code/name của chi nhánh ACTIVE; không mở quyền quản trị Inventory. Count/items cùng snapshot, sort code/id. Chi nhánh vẫn được kiểm lại khi tạo Hold.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang chi nhánh nhận
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  page: { $ref: '#/components/schemas/PageMetadata' }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, code, name]
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /holds/queue:
    get:
      operationId: listHoldQueue
      tags: [Hold]
      summary: Nhân viên xem hàng chờ của một đầu sách tại chi nhánh
      description: Chỉ WAITING, queuedAt/id tăng dần; không trả danh sách người đọc cho reader.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: bookId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Hàng chờ, content: { application/json: { schema: { $ref: '#/components/schemas/HoldPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /health:
    get:
      operationId: getCoreHealth
      summary: Kiểm tra tiến trình Core Service
      tags: [System]
      responses:
        '200':
          description: Tiến trình đang phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /catalog-media/{kind}/{subject}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [authors, editions] } }
      - { name: subject, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCatalogMedia
      tags: [Catalog media]
      summary: Đọc tham chiếu ảnh đã được nhân viên duyệt
      description: Tài khoản ACTIVE còn READER/LIBRARIAN/ADMIN. Đối tượng tồn tại nhưng chưa có ảnh trả media null.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tham chiếu đã duyệt hoặc null
          content:
            application/json:
              schema:
                type: object
                required: [media]
                properties:
                  media:
                    oneOf:
                      - { $ref: '#/components/schemas/CatalogMediaReference' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: approveCatalogMedia
      tags: [Catalog media]
      summary: Nhân viên duyệt hoặc thay tham chiếu ảnh
      description: >-
        Chỉ LIBRARIAN/ADMIN ACTIVE. Nhân viên xác nhận đúng định danh và quyền sử dụng;
        Core kiểm URL HTTPS theo nhà cung cấp, không redirect, MIME/signature, tối đa 2 MiB và 6 giây.
        Không tải ảnh vào kho lưu trữ. expectedVersion null chỉ tạo khi chưa có ảnh;
        thay ảnh phải gửi version hiện tại. Quyền được kiểm tra lại sau khi kiểm ảnh.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogMediaRequest' }
      responses:
        '200': { description: Tham chiếu đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogMediaReference' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeCatalogMedia
      tags: [Catalog media]
      summary: Gỡ tham chiếu ảnh, không xóa file ở nhà cung cấp
      description: Chỉ LIBRARIAN/ADMIN ACTIVE; version thiếu hoặc âm trả 422, không khớp trả 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '204': { description: Đã gỡ tham chiếu }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    LoanStatus:
      name: status
      in: query
      schema: { type: string, enum: [ACTIVE, OVERDUE, RETURNED] }
    LoanFrom:
      name: from
      in: query
      description: borrowedAt >= from; ISO 8601 có múi giờ, năm 0001–9999.
      schema: { type: string, format: date-time }
    LoanTo:
      name: to
      in: query
      description: borrowedAt < to; nếu có cả hai mốc thì from phải nhỏ hơn to.
      schema: { type: string, format: date-time }
    LoanSort:
      name: sort
      in: query
      description: Thứ tự thêm loanId tăng dần để phân trang ổn định khi trùng thời gian.
      schema: { type: string, enum: ['borrowedAt,asc', 'borrowedAt,desc', 'dueAt,asc', 'dueAt,desc'], default: 'borrowedAt,desc' }
    LoanPage:
      name: page
      in: query
      schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
    LoanSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    AuthSession:
      description: Access JWT trong JSON; refresh opaque chỉ trong HttpOnly cookie lams_refresh
      headers:
        Set-Cookie:
          schema: { type: string }
          description: 'lams_refresh; HttpOnly; Path=/api/v1/auth. Local SameSite=Lax; pilot SameSite=None và Secure, kèm kiểm tra Origin/header cho POST Auth.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthSessionResponse' }
    Problem:
      description: Lỗi theo Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  schemas:
    AcquisitionFacts:
      type: object
      required: [contractVersion, sourceRevision, bookId, branchId, window, copiesOwned,
        copiesAvailable, waitingHolds, loansStarted, favoritesAdded]
      properties:
        contractVersion: { type: string, const: acquisition-source-v1 }
        sourceRevision: { type: string, const: core-acquisition-read-v1 }
        bookId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        window:
          type: object
          required: [from, to, asOf]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            asOf: { type: string, format: date-time }
        copiesOwned: { type: integer, minimum: 0 }
        copiesAvailable: { type: integer, minimum: 0 }
        waitingHolds: { $ref: '#/components/schemas/AcquisitionCountSignal' }
        loansStarted: { $ref: '#/components/schemas/AcquisitionCountSignal' }
        favoritesAdded: { $ref: '#/components/schemas/AcquisitionCountSignal' }
    AcquisitionCountSignal:
      type: object
      required: [count, basis, source, unavailableReason]
      properties:
        count: { type: [integer, 'null'], minimum: 0 }
        basis: { type: [string, 'null'], enum: [CURRENT_STATE, WINDOWED_ROWS, EVENT_ADDS, null] }
        source: { type: [string, 'null'] }
        unavailableReason: { type: [string, 'null'] }
    InventoryCloseRequest:
      type: object
      required: [requestId, version]
      properties:
        requestId: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        reason: { type: [string, 'null'], maxLength: 500, description: Bắt buộc không rỗng khi hủy }
    InventoryPagination:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0, maximum: 10000 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    InventoryResolutionRequest:
      type: object
      required: [requestId, action, reason]
      properties:
        requestId: { type: string, format: uuid }
        action: { type: string, enum: [REVIEWED, MOVE_TO_SCANNED_SHELF] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedCopyVersion: { type: [integer, 'null'], minimum: 0 }
    InventoryResolution:
      type: object
      required: [id, anomalyId, action, reason, copyVersionSeen, copyVersionAfter, resolvedBy, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        anomalyId: { type: string, format: uuid }
        action: { type: string, enum: [REVIEWED, MOVE_TO_SCANNED_SHELF] }
        reason: { type: string }
        copyVersionSeen: { type: [integer, 'null'], minimum: 0 }
        copyVersionAfter: { type: [integer, 'null'], minimum: 0 }
        resolvedBy: { type: string, format: uuid }
        resolvedAt: { type: string, format: date-time }
    InventorySession:
      type: object
      required: [id, branchId, shelfId, openedBy, openedAt, status, version, snapshotCount, scanCount, closedAt, closedBy, closeReason]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        shelfId: { type: [string, 'null'], format: uuid }
        openedBy: { type: string, format: uuid }
        openedAt: { type: string, format: date-time }
        status: { type: string, enum: [OPEN, FINALIZED, CANCELLED] }
        version: { type: integer, minimum: 0 }
        snapshotCount: { type: integer, minimum: 0, maximum: 5000 }
        scanCount: { type: integer, minimum: 0, maximum: 20000 }
        closedAt: { type: [string, 'null'], format: date-time }
        closedBy: { type: [string, 'null'], format: uuid }
        closeReason: { type: [string, 'null'] }
    InventoryCopyEvidence:
      type: object
      required: [id, barcode, branchId, shelfId, status, version]
      properties:
        id: { type: string, format: uuid }
        barcode: { type: string }
        branchId: { type: string, format: uuid }
        shelfId: { type: string, format: uuid }
        status: { type: string }
        version: { type: integer, minimum: 0 }
    InventoryScan:
      type: object
      required: [id, clientScanId, barcode, branchId, shelfId, scannedBy, receivedAt, clientScannedAt]
      properties:
        id: { type: string, format: uuid }
        clientScanId: { type: string, format: uuid }
        barcode: { type: string }
        branchId: { type: string, format: uuid }
        shelfId: { type: string, format: uuid }
        scannedBy: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        clientScannedAt: { type: [string, 'null'], format: date-time }
    InventoryAnomaly:
      type: object
      required: [id, kind, copyId, evidence, detectedAt, resolution]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [WRONG_SHELF, EXPECTED_BUT_MISSING, STATUS_MISMATCH, WRONG_BRANCH, UNKNOWN_BARCODE, DUPLICATE_SCAN] }
        copyId: { type: [string, 'null'], format: uuid }
        evidence:
          type: object
          description: Snapshot và trạng thái Copy lúc đối chiếu, scan liên quan, firstScanId khi quét trùng; các giá trị có thể null khi không tồn tại. Nội dung cố định sau finalize, không phải lệnh sửa Copy.
        detectedAt: { type: string, format: date-time }
        resolution:
          oneOf:
            - { $ref: '#/components/schemas/InventoryResolution' }
            - { type: 'null' }
    Role:
      type: string
      enum: [READER, LIBRARIAN, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED, DISABLED]
    ProfileMetadata:
      type: object
      description: Metadata Member chỉ xuất hiện sau khi có field Member-specific được duyệt và persistence được triển khai.
      required: [createdAt, updatedAt]
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CurrentMemberProfile:
      type: object
      required: [userId, memberCode, fullName, email, status, profile]
      properties:
        userId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/ProfileMetadata' }
            - { type: 'null' }
          description: null trong baseline; GET không tạo hoặc cập nhật dữ liệu.
    MemberItem:
      type: object
      required: [userId, memberCode, fullName, status]
      properties:
        userId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
    PageMetadata:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    MemberPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemberItem' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    Favorite:
      type: object
      required: [bookId, bookTitle, favoritedAt]
      properties:
        bookId: { type: string, format: uuid }
        bookTitle: { type: string }
        favoritedAt: { type: string, format: date-time }
    FavoritePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Favorite' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    ReviewRequest:
      type: object
      description: Rating phải là số nguyên JSON; chuỗi hoặc số có phần lẻ trả 400, số nguyên ngoài 1–5 trả 422.
      required: [body, rating]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        rating: { type: integer, minimum: 1, maximum: 5 }
    ReviewUpdateRequest:
      type: object
      minProperties: 1
      description: Phải có body hoặc rating không null. Không gửi lại field không định sửa. Rating dạng chuỗi hoặc số có phần lẻ trả 400; số nguyên ngoài 1–5 trả 422.
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        rating: { type: integer, minimum: 1, maximum: 5 }
    Review:
      type: object
      required: [reviewId, bookId, body, rating, createdAt, updatedAt, mine]
      properties:
        reviewId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        body: { type: string, maxLength: 5000 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        mine: { type: boolean, description: Review có thuộc principal hiện tại hay không; không tiết lộ userId. }
    ReviewPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    RatingSummary:
      type: object
      required: [bookId, average, count]
      properties:
        bookId: { type: string, format: uuid }
        average: { type: [number, 'null'], minimum: 1, maximum: 5, multipleOf: 0.01 }
        count: { type: integer, minimum: 0 }
    AuthorRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: Tên sẽ được loại khoảng trắng ở hai đầu. }
    Author:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
    AuthorPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Author' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
    CategoryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    CategoryAliasRequest:
      type: object
      required: [categoryId, name]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 150 }
    CategoryAlias:
      type: object
      required: [id, categoryId, name, normalizedAlias]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        normalizedAlias: { type: string, maxLength: 150 }
    CategoryAliasPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CategoryAlias' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    PublisherRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    Publisher:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
    PublisherPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Publisher' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    BookRequest:
      type: object
      required: [title, authorIds, categoryIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 10000 }
        authorIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        categoryIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
    BookRelatedItem:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Book:
      type: object
      required: [id, title, authors, categories]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        authors:
          type: array
          items: { $ref: '#/components/schemas/BookRelatedItem' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/BookRelatedItem' }
    PublicCover:
      type: object
      required: [editionId, imageUrl, source, sourceUrl, license, licenseUrl, attribution, approvedAt]
      properties:
        editionId: { type: string, format: uuid }
        imageUrl: { type: string, format: uri }
        source: { type: string, enum: [open-library, wikimedia, standard-ebooks] }
        sourceUrl: { type: string, format: uri }
        license: { type: string }
        licenseUrl: { type: string, format: uri }
        attribution: { type: string }
        approvedAt: { type: string, format: date-time }
    PublicDirectoryImage:
      type: object
      required: [subjectId, imageUrl, source, sourceUrl, license, licenseUrl, attribution, approvedAt, context]
      properties:
        subjectId: { type: string, format: uuid }
        imageUrl: { type: string, format: uri }
        source: { type: string, enum: [open-library, wikimedia, standard-ebooks] }
        sourceUrl: { type: string, format: uri }
        license: { type: string }
        licenseUrl: { type: string, format: uri }
        attribution: { type: string }
        approvedAt: { type: string, format: date-time }
        context: { type: string, enum: [portrait, book-cover] }
    AccountCenter:
      type: object
      required: [userId, memberCode, fullName, email, status, phone, pendingEmail, pendingEmailRequestedAt]
      properties:
        userId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [ACTIVE, LOCKED, DISABLED] }
        phone: { type: [string, 'null'] }
        pendingEmail: { type: [string, 'null'], format: email }
        pendingEmailRequestedAt: { type: [string, 'null'], format: date-time }
    PublicBook:
      type: object
      required: [id, title, description, authors, categories, cover, averageRating, ratingCount, catalogSource]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        authors: { type: array, items: { $ref: '#/components/schemas/BookRelatedItem' } }
        categories: { type: array, items: { $ref: '#/components/schemas/BookRelatedItem' } }
        cover: { anyOf: [{ $ref: '#/components/schemas/PublicCover' }, { type: 'null' }] }
        averageRating: { type: [number, 'null'], minimum: 1, maximum: 5, description: 'null khi chưa có đánh giá' }
        ratingCount: { type: integer, minimum: 0 }
        catalogSource:
          description: Nguồn biên mục ngoài; ngày phát hành ebook không phải năm xuất bản sách in.
          anyOf:
            - type: object
              required: [sourceCode, sourceUrl, ebookReleasedOn]
              properties:
                sourceCode: { type: string, example: PROJECT_GUTENBERG }
                sourceUrl: { type: string, format: uri }
                ebookReleasedOn: { type: [string, 'null'], format: date }
            - type: 'null'
    BookPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Book' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    EditionRequest:
      type: object
      properties:
        isbn13: { type: [string, 'null'], pattern: '^[0-9]{13}$' }
        publisherId: { type: [string, 'null'], format: uuid }
        publicationYear: { type: [integer, 'null'], minimum: 1000, maximum: 9999 }
        language: { type: [string, 'null'], maxLength: 35 }
    Edition:
      type: object
      required: [id, bookId, bookTitle]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        bookTitle: { type: string }
        isbn13: { type: [string, 'null'] }
        publisherId: { type: [string, 'null'], format: uuid }
        publisherName: { type: [string, 'null'] }
        publicationYear: { type: [integer, 'null'] }
        language: { type: [string, 'null'] }
    EditionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Edition' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    BranchRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 30 }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [ACTIVE, DISABLED], default: ACTIVE }
    Branch:
      type: object
      required: [id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
    BranchPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Branch' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    ShelfRequest:
      type: object
      required: [branchId, code, label]
      properties:
        branchId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 30 }
        label: { type: string, minLength: 1, maxLength: 150 }
        sortOrder: { type: integer, minimum: 0, default: 0 }
    Shelf:
      type: object
      required: [id, branchId, branchCode, code, label, sortOrder]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        branchCode: { type: string }
        code: { type: string }
        label: { type: string }
        sortOrder: { type: integer }
    ShelfPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Shelf' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    CopyStatus:
      type: string
      enum: [IN_PROCESS, AVAILABLE, ON_LOAN, ON_HOLD, LOST, DAMAGED, WITHDRAWN]
    CopyStateRequest:
      type: object
      required: [requestId, version, status, reason]
      properties:
        requestId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        status: { type: string, minLength: 1, description: Đích không thuộc transition bảo trì cho phép trả 409. }
        reason: { type: string, minLength: 1, maxLength: 500 }
    BorrowRequest:
      type: object
      required: [requestId, copyId, readerId, branchId, copyVersion]
      properties:
        requestId: { type: string, format: uuid }
        copyId: { type: string, format: uuid }
        readerId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        copyVersion: { type: integer, format: int64, minimum: 0 }
    ReturnRequest:
      type: object
      required: [requestId, branchId, version]
      properties:
        requestId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0, description: Version Loan, không phải Copy. }
    VersionedRequest:
      type: object
      required: [requestId, version]
      properties:
        requestId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0, description: Version của Hold hoặc Loan đang thao tác; chỉ nhận số nguyên JSON. }
    HoldRequest:
      type: object
      required: [requestId, bookId, branchId, anyEdition]
      properties:
        requestId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        editionId: { type: [string, 'null'], format: uuid }
        anyEdition: { type: boolean, description: Phải xác nhận rõ; true yêu cầu editionId null, false yêu cầu editionId thuộc Book. }
    Hold:
      type: object
      required: [id, readerId, bookId, editionId, branchId, status, queuedAt, readyAt, expiresAt, closedAt, copyId, loanId, version, policyVersion, pickupSeconds]
      properties:
        id: { type: string, format: uuid }
        readerId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        editionId: { type: [string, 'null'], format: uuid, description: Null nghĩa là người đọc đã chọn bất kỳ ấn bản nào. }
        branchId: { type: string, format: uuid }
        status: { type: string, enum: [WAITING, READY, FULFILLED, CANCELLED, EXPIRED] }
        queuedAt: { type: string, format: date-time }
        readyAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        copyId: { type: [string, 'null'], format: uuid }
        loanId: { type: [string, 'null'], format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        policyVersion: { type: string }
        pickupSeconds: { type: integer, minimum: 1, maximum: 31622400 }
    HoldEstimate:
      type: object
      required: [holdId, holdVersion, asOf, estimatedAt, reason, policyVersion, compatibleCopies, waitingAhead]
      properties:
        holdId: { type: string, format: uuid }
        holdVersion: { type: integer, minimum: 0, maximum: 9007199254740991 }
        asOf: { type: string, format: date-time }
        estimatedAt: { type: [string, 'null'], format: date-time }
        reason:
          type: string
          enum: [CONDITIONAL, READY, CLOSED, AWAITING_EXPIRY, BRANCH_INACTIVE, READER_INELIGIBLE, SCOPE_TOO_LARGE, INCONSISTENT_COPY, OVERDUE_COPY, FUTURE_QUEUE_TIME, NO_COMPATIBLE_COPY, QUEUE_CHANGED]
        policyVersion: { type: string }
        compatibleCopies: { type: integer, minimum: 0, maximum: 500, description: Số bản lưu thông phù hợp phạm vi ấn bản; 0 khi chưa đọc hoặc vượt giới hạn. }
        waitingAhead: { type: integer, minimum: 0, maximum: 499, description: Số WAITING phía trước cùng Book/Branch, gồm các ấn bản khác; 0 khi chưa đọc hoặc vượt giới hạn. }
    HoldView:
      type: object
      required: [hold, queuePosition, bookTitle, branchName]
      properties:
        bookTitle: { type: string, description: Tên đầu sách hiện tại. }
        branchName: { type: string, description: Tên chi nhánh nhận hiện tại. }
        hold: { $ref: '#/components/schemas/Hold' }
        queuePosition: { type: [integer, 'null'], minimum: 1, description: Vị trí WAITING chung của Book tại Branch, chưa lọc Edition/eligibility; không phải ETA hoặc lời hứa thứ tự nhận. Null khi không còn WAITING. }
    HoldPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HoldView' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    LoanHistoryItem:
      allOf:
        - { $ref: '#/components/schemas/LoanCommandResult' }
        - type: object
          required: [bookTitle, barcode, branchName, status, overdue]
          properties:
            bookTitle: { type: string }
            barcode: { type: string }
            branchName: { type: string }
            status: { type: string, enum: [ACTIVE, OVERDUE, RETURNED] }
            overdue: { type: boolean }
    LoanHistoryPage:
      type: object
      required: [items, page, asOf]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LoanHistoryItem' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
        asOf: { type: string, format: date-time }
    CirculationTotals:
      type: object
      required: [borrowed, active, returned, overdue]
      properties:
        borrowed: { type: integer, format: int64, minimum: 0 }
        active: { type: integer, format: int64, minimum: 0 }
        returned: { type: integer, format: int64, minimum: 0 }
        overdue: { type: integer, format: int64, minimum: 0 }
    CirculationReport:
      type: object
      required: [from, to, timezone, asOf, totals, items]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timezone: { type: string, enum: [UTC, Asia/Ho_Chi_Minh] }
        asOf: { type: string, format: date-time }
        totals: { $ref: '#/components/schemas/CirculationTotals' }
        items:
          type: array
          maxItems: 10000
          items:
            allOf:
              - { $ref: '#/components/schemas/CirculationTotals' }
              - type: object
                required: [date, branchId, branchName]
                properties:
                  date: { type: string, format: date }
                  branchId: { type: string, format: uuid }
                  branchName: { type: string }
    LoanCommandResult:
      type: object
      required: [loanId, copyId, readerId, editionId, branchId, borrowedAt, dueAt, returnedAt, renewalCount, version, copyVersion]
      properties:
        loanId: { type: string, format: uuid }
        copyId: { type: string, format: uuid }
        readerId: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        borrowedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        returnedAt: { type: [string, 'null'], format: date-time }
        renewalCount: { type: integer, minimum: 0 }
        version: { type: integer, format: int64, minimum: 0 }
        copyVersion: { type: integer, format: int64, minimum: 0 }
    BookCopyRequest:
      type: object
      required: [editionId, barcode, shelfId]
      properties:
        editionId: { type: string, format: uuid }
        barcode: { type: string, minLength: 1, maxLength: 100 }
        shelfId: { type: string, format: uuid }
    BookCopyUpdateRequest:
      allOf:
        - { $ref: '#/components/schemas/BookCopyRequest' }
        - type: object
          required: [version]
          properties:
            version: { type: integer, format: int64, minimum: 0, description: Version hiện tại; thiếu trả 422, đã cũ trả 409. }
    BookCopy:
      type: object
      required: [id, editionId, shelfId, branchId, shelfCode, barcode, status, version]
      properties:
        id: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        bookTitle: { type: string }
        isbn13: { type: [string, 'null'] }
        shelfId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        shelfCode: { type: string }
        barcode: { type: string }
        status: { $ref: '#/components/schemas/CopyStatus' }
        version: { type: integer, minimum: 0 }
    CopyPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InventoryCopyView' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    InventoryCopyView:
      type: object
      description: Projection chỉ đọc cho inventory query; id giữ tương thích với response cũ, copyId là tên rõ nghĩa cho consumer kiểm kê.
      required: [id, copyId, editionId, shelfId, branchId, shelfCode, barcode, status, version]
      properties:
        id: { type: string, format: uuid }
        copyId: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        bookTitle: { type: string }
        isbn13: { type: [string, 'null'] }
        shelfId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        shelfCode: { type: string }
        barcode: { type: string }
        status: { $ref: '#/components/schemas/CopyStatus' }
        version: { type: integer, minimum: 0 }
    CatalogMediaRequest:
      type: object
      required: [source, sourceId, sourceUrl, imageUrl, license, licenseUrl, attribution, evidence, confirmed]
      properties:
        source: { type: string, enum: [open-library, google-books, wikimedia, standard-ebooks] }
        sourceId: { type: string, minLength: 1, maxLength: 500 }
        sourceUrl: { type: string, format: uri, maxLength: 2048 }
        imageUrl: { type: string, format: uri, maxLength: 2048 }
        license: { type: string, minLength: 1, maxLength: 500 }
        licenseUrl: { type: string, format: uri, maxLength: 2048 }
        attribution: { type: string, minLength: 1, maxLength: 2000 }
        evidence: { type: string, minLength: 1, maxLength: 2000 }
        confirmed: { type: boolean, const: true }
        expectedVersion:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Null để tạo mới; khi thay ảnh gửi đúng revision đã đọc. Không tự cộng hoặc mặc định 0; revision không tái sử dụng sau xóa/tạo lại.
    CatalogMediaReference:
      type: object
      required: [id, source, sourceId, sourceUrl, imageUrl, license, licenseUrl, attribution, evidence, mime, byteSize, approvedBy, approvedAt, version]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [open-library, google-books, wikimedia, standard-ebooks] }
        sourceId: { type: string }
        sourceUrl: { type: string, format: uri }
        imageUrl: { type: string, format: uri }
        license: { type: string }
        licenseUrl: { type: string, format: uri }
        attribution: { type: string }
        evidence: { type: string }
        mime: { type: string, enum: [image/jpeg, image/png, image/webp] }
        byteSize: { type: integer, minimum: 1, maximum: 2097152 }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      description: Role và memberCode luôn do server quyết định; trường lạ bị bỏ qua, không được dùng để cấp quyền.
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: Email hoặc memberCode }
        password: { type: string, writeOnly: true }
        remember: { type: boolean, default: false }
    CurrentUserResponse:
      type: object
      required: [id, memberCode, email, fullName, roles]
      properties:
        id: { type: string, format: uuid }
        memberCode: { type: string, example: TV-0123456789ABCDEF }
        email: { type: string, format: email }
        fullName: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    AuthSessionResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, user]
      properties:
        accessToken: { type: string, description: JWT ngắn hạn, giữ trong memory }
        accessTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/CurrentUserResponse' }
    HealthResponse:
      type: object
      required: [service, status, timestamp]
      properties:
        service:
          type: string
          const: lams-core-service
        status:
          type: string
          enum: [UP]
        timestamp:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      required: [type, title, status, detail, instance, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationError' }
    ValidationError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
