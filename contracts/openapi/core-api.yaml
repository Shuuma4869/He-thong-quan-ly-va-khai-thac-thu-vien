  /loans:
    get:
      operationId: listLoansForStaff
      tags: [Circulation]
      summary: Nhân viên lọc lịch sử mượn
      description: >-
        Chỉ LIBRARIAN/ADMIN ACTIVE còn quyền hiện hành. Bộ lọc kết hợp bằng AND; from bao gồm, to loại trừ,
        áp dụng borrowedAt. ACTIVE bao gồm cả đang mượn quá hạn; OVERDUE là phần đang mở có dueAt < asOf.
        Count/items cùng snapshot PostgreSQL. Branch/Edition lấy tại lúc mượn; tên sách/chi nhánh và barcode là giá trị hiện tại.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: readerId, in: query, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: copyId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/LoanStatus' }
        - { $ref: '#/components/parameters/LoanFrom' }
        - { $ref: '#/components/parameters/LoanTo' }
        - { $ref: '#/components/parameters/LoanSort' }
        - { $ref: '#/components/parameters/LoanPage' }
        - { $ref: '#/components/parameters/LoanSize' }
      responses:
        '200': { description: Trang lịch sử, content: { application/json: { schema: { $ref: '#/components/schemas/LoanHistoryPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: borrowCopy
      tags: [Circulation]
      summary: Nhân viên cho mượn bản sách sẵn sàng
      description: >-
        LIBRARIAN/ADMIN ACTIVE còn quyền hiện hành. Core khóa người mượn rồi Book/Copy, kiểm policy, chi nhánh
        và copyVersion; tạo Loan, đổi Copy, ghi audit/outbox trong một transaction. Nhận Copy AVAILABLE khi không có
        hàng chờ đủ điều kiện, hoặc ON_HOLD của đúng người nhận trước expiresAt. requestId dùng lại khi retry.
        Cùng actor/key/nội dung trả 201 với snapshot response gốc, kể cả Loan đã trả sau đó; không phải query hiện trạng.
        Cùng key khác nội dung trả 409. Key chỉ được lưu sau thành công; lỗi rollback có thể gửi lại cùng key.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BorrowRequest' }
      responses:
        '201': { description: Loan đã tạo hoặc kết quả gốc của yêu cầu gửi lại, content: { application/json: { schema: { $ref: '#/components/schemas/LoanCommandResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/loans:
    get:
      operationId: listMyLoans
      tags: [Circulation]
      summary: Xem lịch sử mượn của mình
      description: >-
        Tài khoản ACTIVE còn READER/LIBRARIAN/ADMIN. Người mượn luôn lấy từ principal.
        Phân trang mặc định 20, tối đa 100; from/to lọc borrowedAt theo [from,to).
        ACTIVE bao gồm OVERDUE; quá hạn tính tại asOf, đúng hạn chưa quá hạn.
