      description: >-
        LIBRARIAN/ADMIN ACTIVE. Chỉ IN_PROCESS sang AVAILABLE/WITHDRAWN, AVAILABLE sang LOST/DAMAGED,
        DAMAGED sang IN_PROCESS/WITHDRAWN, LOST sang IN_PROCESS. Không dùng để đóng Loan hoặc giải phóng Hold.
        Cùng actor/requestId và nội dung trả lại response lần đầu; đổi nội dung cùng key trả 409.
