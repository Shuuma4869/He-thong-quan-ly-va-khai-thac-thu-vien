      operationId: removeCatalogMedia
      tags: [Catalog media]
      summary: Gỡ tham chiếu ảnh, không xóa file ở nhà cung cấp
      description: Chỉ LIBRARIAN/ADMIN ACTIVE; version thiếu hoặc âm trả 422, không khớp trả 409.
