      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Đã xóa tác giả }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /categories:
    get:
      operationId: listCategories
      tags: [Catalog]
      summary: Lấy danh sách thể loại có phân trang
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Danh sách thể loại theo trang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCategory
      tags: [Catalog]
      summary: Tạo thể loại
      security: [{ bearerAuth: [] }]
      requestBody:
