spring:
  application:
    name: lams-core-service
  datasource:
    url: ${CORE_DATABASE_URL:jdbc:postgresql://localhost:15432/lams_core}
    username: ${CORE_DATABASE_USERNAME:lams}
    password: ${CORE_DATABASE_PASSWORD:lams-local-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: lams-core-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${CORE_PORT:8080}

lams:
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    job-enabled: ${OUTBOX_JOB_ENABLED:true}
  circulation:
    max-active-holds: ${CIRCULATION_MAX_ACTIVE_HOLDS:10}
    hold-job-enabled: ${CIRCULATION_HOLD_JOB_ENABLED:true}
    hold-job-delay-ms: ${CIRCULATION_HOLD_JOB_DELAY_MS:30000}
    policy:
      # Giá trị phát triển PROVISIONAL; đổi version khi thay chính sách.
      version: ${CIRCULATION_POLICY_VERSION:dev-provisional-v1}
      max-active-loans: ${CIRCULATION_MAX_ACTIVE_LOANS:5}
      loan-duration: ${CIRCULATION_LOAN_DURATION:P14D}
      max-renewals: ${CIRCULATION_MAX_RENEWALS:1}
      renewal-duration: ${CIRCULATION_RENEWAL_DURATION:P7D}
      pickup-duration: ${CIRCULATION_PICKUP_DURATION:PT48H}
      block-overdue: ${CIRCULATION_BLOCK_OVERDUE:true}
  auth:
    jwt-secret: ${LAMS_JWT_SECRET}
    access-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-ttl: ${AUTH_REFRESH_TOKEN_TTL:PT8H}
    remember-ttl: ${AUTH_REMEMBER_TOKEN_TTL:P30D}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://tauri.localhost}
